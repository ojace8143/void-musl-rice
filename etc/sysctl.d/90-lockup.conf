# Make hard freezes/hangs leave evidence in dmesg (which socklog persists).
#
# hardlockup_panic=1 is already the kernel/runit default here; these add the
# all-CPU backtraces so a stuck CPU or blocked task dumps stacks instead of
# hanging silently. panic=30 reboots if the kernel does panic, so the box does
# not sit dead forever.
kernel.sysrq = 1
kernel.panic = 30
kernel.hardlockup_all_cpu_backtrace = 1
kernel.softlockup_all_cpu_backtrace = 1
kernel.hung_task_all_cpu_backtrace = 1
