# MediaTek MT7922 (mt7921e) on the ASUS TUF A15 FA507XV.
#
# PCIe ASPM L1 is enabled by default on this card and is a known cause of
# firmware hangs that take the whole machine down (last frame frozen, no VT
# switch). Disable ASPM for this device only; the rest of the PCIe tree keeps
# its power saving.
options mt7921e disable_aspm=1
